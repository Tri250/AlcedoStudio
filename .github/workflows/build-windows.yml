# Windows 版：打包、冒烟测试、生成安装程序和便携版 zip。
# 手动运行（Actions → build-windows → Run workflow），或推送 v* 标签时自动运行并上传到对应 Release。
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: 安装依赖
        run: pip install -r requirements.txt pywebview pyinstaller pillow
      - name: 安装前端用例依赖（tests/js 用 jsdom，版本按 package-lock.json；回归里的前端用例缺它就红）
        run: npm ci
      - name: 设备无关回归测试
        run: |
          $env:ADB = "$env:ANDROID_HOME\platform-tools\adb.exe"
          python -m unittest discover -s tests -v
      - name: 读版本号
        id: ver
        run: |
          $v = python gui/version.py
          "ver=$v" >> $env:GITHUB_OUTPUT
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --distpath gui/dist --workpath gui/build gui/windows.spec
      - name: 冒烟测试（命令行、GUI 页面、图片与 JS API）
        run: |
          $env:ADB = "$env:ANDROID_HOME\platform-tools\adb.exe"
          $env:ADBUTILS_ADB_PATH = $env:ADB
          python gui/smoke_test.py gui\dist\AndroidAdCleaner\aac-cli.exe --gui
      - name: 便携版 zip
        run: Compress-Archive -Path gui/dist/AndroidAdCleaner -DestinationPath "gui/dist/AiClean-${{ steps.ver.outputs.ver }}-windows-portable.zip"
      - name: 安装程序（Inno Setup）
        run: |
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile gui/ChineseSimplified.isl } catch { Write-Host "中文语言包下载失败，安装界面用英文" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAPPVER=${{ steps.ver.outputs.ver }}" gui/installer.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ steps.ver.outputs.ver }}
          path: |
            gui/dist/*.zip
            gui/dist/*-setup.exe
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # 安卓工作流也在同一标签上建 Release，谁先跑完谁建，后到的直接往里传
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Ai.Clean $tag" --generate-notes
          }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($file in Get-ChildItem gui/dist/*.zip, gui/dist/*-setup.exe) {
            if ($release.assets.name -contains $file.Name) {
              Write-Host "已存在，保留：$($file.Name)"
              continue
            }
            gh release upload $tag $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "上传失败：$($file.Name)" }
          }
