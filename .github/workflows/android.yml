name: android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set isolated build output
        run: echo "QINGJING_ANDROID_BUILD_DIR=$RUNNER_TEMP/qingjing-android/app" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Android SDK
        run: |
          test -d "$ANDROID_HOME"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$sdkmanager"
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.QINGJING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.QINGJING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "⚠️ 未配置 QINGJING_KEYSTORE_B64 / QINGJING_KEY_PASSWORD，本次构建退回 debug 签名：可以安装验证，但不是正式发布签名。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import os, base64
          from pathlib import Path
          folder = Path('.private/android-signing')
          folder.mkdir(parents=True, exist_ok=True)
          key = folder / 'qingjing-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64']))
          password = os.environ['KEY_PASSWORD']
          assert password and key.stat().st_size > 0
          (folder / 'keystore.properties').write_text(f'storeFile={key.resolve()}\nstorePassword={password}\nkeyAlias=qingjing\nkeyPassword={password}\n')
          PY
      - name: Build signed APK
        working-directory: android
        run: |
          export CHAQUOPY_PYTHON="$(command -v python3.12 || command -v python3)"
          gradle --no-daemon --console=plain assembleRelease
      - name: Verify signature and application identity
        run: |
          # 产物名跟 tag 走（v1.0.4-1109v1 → 1.0.4-1109v1）；手动触发时退回 gui/version.py 的版本号
          REL="${GITHUB_REF_NAME#v}"
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) REL="$(python3 gui/version.py)" ;;
          esac
          echo "REL=$REL" >> "$GITHUB_ENV"
          mkdir -p delivery
          cp "$QINGJING_ANDROID_BUILD_DIR/outputs/apk/release/app-release.apk" "delivery/AiClean-$REL-android-arm64.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs delivery/*.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging delivery/*.apk | tee delivery/android-package-info.txt
          grep -q "package: name='com.aigoodbro.qingjing'" delivery/android-package-info.txt
          cd delivery
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AiClean-android-${{ env.REL }}
          path: delivery/
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # build-windows 工作流也在同一标签上建 Release，谁先跑完谁建，后到的只补产物
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Ai.Clean ${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            "delivery/AiClean-${REL}-android-arm64.apk" \
            delivery/SHA256SUMS-android.txt \
            delivery/android-package-info.txt
